name: Eval Gate

on:
  pull_request:
    paths:
      - 'prompts/**'
      - 'backend/agents/**'
      - 'backend/gateway/**'
      - 'evals/**'

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-only-eval-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/
          pip install ruff pytest pytest-asyncio pydantic

      - name: Run CI Eval Gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m evals.runner.run_eval --golden evals/golden/ci_subset.jsonl --repeats 3 --check-thresholds --mock

      - name: Upload Evaluation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: evals/reports/
